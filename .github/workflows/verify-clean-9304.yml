name: Verify clean #9304 cache fix

on:
  push:
    branches:
      - validation/9304-clean-fix-ci

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install runtime and test dependencies
        run: |
          python -m pip install -e ./libs/langgraph -e ./libs/checkpoint-sqlite -e ./libs/checkpoint-postgres pytest pytest-mock pytest-asyncio pytest-dotenv syrupy httpx redis 'psycopg[binary]' psycopg_pool pycryptodome ruff
      - name: Verify new race regression test
        run: NO_DOCKER=true python -m pytest -q libs/langgraph/tests/test_sync_cached_nested_tasks.py
      - name: Verify related existing functional regressions
        run: |
          NO_DOCKER=true python -m pytest -q libs/langgraph/tests/test_pregel.py -k "multiple_interrupts_functional_cache or no_redundant_put_writes_for_cached_task"
      - name: Lint changed source and test
        run: |
          ruff check libs/langgraph/langgraph/pregel/_loop.py libs/langgraph/tests/test_sync_cached_nested_tasks.py
          ruff format --check libs/langgraph/langgraph/pregel/_loop.py libs/langgraph/tests/test_sync_cached_nested_tasks.py
